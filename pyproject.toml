[project]
name = "trading-platform"
version = "0.0.1b0"
description = "Backtesting and paper-trading platform for systematic strategies across crypto spot, perpetuals, and options."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Parquet cache for market data. Prices are stored as strings, so the
    # decimal type is not needed — but columnar storage and compression are.
    "pyarrow>=17.0",
]
# Deliberately no numpy, pandas, or plotting stack. Money is Decimal here and
# pandas would push toward float at exactly the boundary the house rules
# protect; the tearsheet writes its own SVG rather than pulling in matplotlib
# for three chart types. Adding a dependency is a decision, not a convenience.

[project.optional-dependencies]
# There is no web layer. A `ui` extra declaring fastapi/uvicorn sat here for
# a month with nothing importing either (harness/API_MAP.md); it was removed
# on 2026-09-02 rather than left as a promise. When an API exists, its
# dependency is added with it, not before.
# The queryable store (ADR 0010). Optional: every backtest, every metric and
# the whole archive path work without it, and must keep working without it — a
# research result must not depend on a server being up. Added here at the
# moment `store/` first imported it, not before.
store = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: line length is enforced by the formatter, not the linter.
# B027: Strategy's lifecycle hooks (on_start/on_fill/on_finish) are deliberately
#       optional no-ops. Marking them abstract would force every strategy to
#       implement three methods it usually does not need.
ignore = ["E501", "B027"]

[tool.mypy]
python_version = "3.11"
# `files` rather than `packages` because mypy accepts only one of the two, and
# the prompt guard needs checking as well. It lives in scripts/ because ruff
# skips hidden directories — a rule engine under .claude/ would be the single
# unlinted, unchecked Python file in the repository.
# `evals` is included for the same reason `scripts/prompt_guard.py` is: it is
# a measurement harness whose output informs decisions, so a type error there
# corrupts a number rather than crashing a script. An unchecked harness is the
# one thing this repository has learned not to trust.
files = [
    "src/trading_platform",
    "scripts/prompt_guard.py",
    "evals",
    "scripts/run_mutation_eval.py",
    "scripts/run_agent_eval.py",
    "scripts/agent_log.py",
    "scripts/experiment.py",
    "scripts/run_paper.py",
    "scripts/daily_review.py",
    "scripts/store_load_cache.py",
    "scripts/run_collector.py",
    "scripts/run_reconcile.py",
    "scripts/journal_to_store.py",
    "scripts/ticket.py",
    "scripts/run_ops.py",
    "scripts/migrate.py",
    "scripts/fetch_polygon.py",
    "scripts/fetch_coinbase.py",
    "scripts/library.py",
    "scripts/fetch_macro.py",
    "scripts/measure_ml_null.py",
]
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true

# pyarrow ships no type stubs and no py.typed marker. Confined to data/cache.py,
# which is a thin serialisation layer; everything it returns is re-typed at the
# boundary into Bar objects.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
