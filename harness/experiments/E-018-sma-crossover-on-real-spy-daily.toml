id = "E-018"
name = "sma-crossover-on-real-spy-daily"
hypothesis = "A moving-average crossover on SPY daily bars produces out-of-sample risk-adjusted returns distinguishable from doing nothing, after costs."
motivation = "Not because the idea is promising -- SMA crossover on the most efficiently priced instrument in the world is the null hypothesis of systematic trading. This is the first equity result this repository has produced; every prior number is crypto. The question being answered is whether the harness behaves the same way when the asset class changes, and specifically whether it still refuses a result that looks good."
dataset = "Polygon aggregates, SPY daily, adjusted=false, via scripts/fetch_polygon.py"
dataset_version = "polygon-free-2024-09-10..2026-09-04-499bars"
strategy = "SMACrossover"
strategy_version = "unchanged from the crypto runs"
commit = "bfb69fe"
date_range = "2024-09-10..2026-09-04"
method = "Rolling walk-forward, 8 folds, train 150 / test 40 / warmup 100, 9-cell grid (fast 5/10/20 x slow 50/80/100), objective sharpe, periods_per_year=252, default CostModel, RiskLimits() defaults, benchmark SPY buy-and-hold."
result = "REJECTED by the harness, not by the numbers. Efficiency 1.06, mean out-of-sample Sharpe 1.67, 6/8 folds profitable, 0 halted -- figures that read as a discovery. The harness refused them for two stated reasons: a MEDIAN OF 1 out-of-sample fill per fold (6 in total across 8 folds, with fold 2 scoring Sharpe 4.35 on ZERO fills, which is the Sharpe of holding cash), and beating cost-free buy-and-hold in only 4/8 folds. Parameter stability 57% with 6 changes across 8 folds; neighbour ratio 0.74 median, so the surface is not a plateau. The finding is about the sample, not the strategy: 40-bar test windows on a slow-crossover rule generate almost no trades, so there is nothing to compute a Sharpe over."
confidence = "high"
limitations = "Confidence 'high' refers to the VERDICT and not to the Sharpe figures: the verdict rests on fill counts, which are exact integers, while the Sharpe figures rest on a median of 1 fill per fold and mean nothing. 72 fits went into them with no deflation applied -- the harness rejected the result before multiplicity mattered. BACKFILLED: this record was written AFTER the run, which is contrary to charter 42 and is stated rather than hidden. 499 bars is about two years and one regime -- Polygon's free plan silently truncated a six-year request to two (T-594716a0). Dividends absent: adjusted=false price bars understate total return by SPY's ~1.2%/yr yield, which penalises buy-and-hold more than a strategy sitting in cash, so the benchmark comparison is if anything generous to the strategy. The CostModel defaults were calibrated on a crypto fee schedule and are pessimistic for a US equity. A daily bar is stamped midnight exchange-local, so a fill at the next bar's open is ~17 hours after the signal, not seconds. Nine cells over eight folds is 72 fits; the Sharpe figures below are NOT deflated for that."
status = "REJECTED"
next_step = "Do not tune this. The verdict is that the sample cannot support the question, so the next step is more data -- which on this plan means paying for it -- not a different grid."
created = "2026-09-08"
trial_count = 72

