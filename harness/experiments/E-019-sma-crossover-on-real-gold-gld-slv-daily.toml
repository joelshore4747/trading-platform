id = "E-019"
name = "sma-crossover-on-real-gold-gld-slv-daily-gld"
hypothesis = "A moving-average crossover on GLD daily bars produces out-of-sample risk-adjusted returns distinguishable from doing nothing, after costs."
motivation = "The same test as E-018 on SPY, moved to a gold ETF, to find out whether the harness's rejection was about the strategy, the sample design, or the instrument. Run as a deliberate triple so the answer is comparable rather than anecdotal."
dataset = "Polygon aggregates, GLD daily, adjusted=false, via scripts/fetch_polygon.py"
dataset_version = "polygon-free-2024-09-10..2026-09-04-499bars"
strategy = "SMACrossover"
strategy_version = "unchanged from E-018 and the crypto runs"
commit = "209159d"
date_range = "2024-09-10..2026-09-04"
method = "Identical to E-018: rolling walk-forward, 8 folds, train 150 / test 40 / warmup 100, 9-cell grid, objective sharpe, periods_per_year=252, default CostModel, benchmark GLD buy-and-hold."
result = "REJECTED, with FOUR stated reasons against SPY's two. Efficiency 0.71, mean out-of-sample Sharpe 1.42, 4/8 folds profitable, 0 halted. Rejected for: parameter stability 43% (the cell chosen on one fold does not hold up on the next fold's own training data); a MEDIAN OF ZERO out-of-sample fills per fold, 8 in total, with fold 0 scoring 1.09 on none; two folds whose annualisation is not meaningful (6 and 7) yet which the sweep still ranked its grid on; and beating cost-free buy-and-hold in only 3/8 folds. Gold ran hard over the window -- fold 2's buy-and-hold Sharpe was 8.78 against the strategy's 6.85 -- so the strategy underperformed doing nothing on an instrument that went up."
confidence = "high"
limitations = "BACKFILLED, written after the run, contrary to charter 42 and stated rather than hidden. GLD is an ETV holding the physical metal, so it tracks spot minus fees -- unlike USO, which holds futures and measures the roll rather than the commodity. Two years, one regime, silently truncated from a six-year request (T-594716a0). CROSS-INSTRUMENT MULTIPLICITY: this is the third instrument the same strategy has been run against today at 72 fits each, so 216 fits inform the set, and no deflation is applied to any of them -- the harness rejected all three before multiplicity mattered, which is why it did not need to."
status = "REJECTED"
next_step = "Do not tune. All three instruments failed for the same dominant reason -- a 40-bar test window on a slow-crossover rule generates almost no trades -- so the next step is a test design that can produce fills, or more data, not a different grid."
created = "2026-09-08"
trial_count = 72

